  Cart:{init(){this.render()},restore(){try{App.state.cart=JSON.parse(localStorage.getItem('groceriq_cart_v1')||'[]')}catch{App.state.cart=[]}},persist(){localStorage.setItem('groceriq_cart_v1',JSON.stringify(App.state.cart))},add(product,qty=1){const best=product.prices?.[0]||product;const id=product.id||best.productSlug;const existing=App.state.cart.find(c=>c.productId===id);if(existing)existing.quantity=Number((existing.quantity+qty).toFixed(2));else App.state.cart.push({productId:id,productName:product.name||best.name,quantity:qty,unit:best.unit,addedAt:new Date().toISOString()});this.persist();this.render();App.UI.showToast(`${product.name||best.name} added to Smart Cart`)},addByProduct(id){const p=App.state.allProducts.find(x=>x.id===id);if(p)this.add(p,/[lkg]$|lb|kg/i.test(p.prices[0].unit)?1:1)},addFlyerItem(id){const it=App.Flipp.getAllItems().find(x=>x.id===id);const p=App.state.allProducts.find(x=>x.id===it.productSlug);this.add(p||it);document.getElementById('detailCard')?.remove()},remove(productId){App.state.cart=App.state.cart.filter(c=>c.productId!==productId);this.persist();this.render()},updateQty(productId,qty){const c=App.state.cart.find(x=>x.productId===productId);if(c){c.quantity=Math.max(.1,Number(qty)||1);this.persist();this.render()}},clear(){App.state.cart=[];this.persist();this.render()},bestFor(id){return App.state.allProducts.find(p=>p.id===id)?.prices[0]},render(){const root=document.getElementById('cartPanel');const items=App.state.cart;const totals=this.totals();root.innerHTML=`<div class="cart-head"><strong>Smart Cart <span class="cart-badge">${items.length}</span></strong><div class="menu-wrap"><button class="dots" onclick="document.getElementById('miniMenu').classList.toggle('hidden')">…</button><div id="miniMenu" class="mini-menu hidden"><button onclick="App.Cart.clear()">Clear Cart</button></div></div></div><div class="cart-items">${items.length?items.map(c=>this.row(c)).join(''):'<div class="empty">Your smart cart is empty.<br>A   PriceEngine:{normalizeUnit(price,fromUnit,toUnit){const u=String(fromUnit||'').toLowerCase();if(u==='lb')return price*2.20462;if(u==='kg')return price;if(u==='g'||/g$/.test(u)){const grams=parseFloat(u)||1;return price*(1000/grams)}if(u==='4l')return price/4;if(u==='l')return price;if(u==='ml'||/ml$/.test(u)){const ml=parseFloat(u)||1;return price*(1000/ml)}return price},normalizeComparable(item){return this.normalizeUnit(item.price,item.unit,'kg')},scoreOption(price,quality=3,storeCount=1){const qualityInverse=(6-quality);return (price*.60)+(qualityInverse*.25)+(App.config.tripOverhead*Math.max(0,storeCount-1)*.15)},optimize(cartItems){const assignments={};cartItems.forEach(c=>{const p=App.state.allProducts.find(x=>x.id===c.productId);if(!p)return;let best=p.prices.map(pr=>({...pr,score:this.scoreOption(this.normalizeComparable(pr),3,1)})).sort((a,b)=>a.score-b.score)[0];assignments[best.storeId]??={storeId:best.storeId,items:[],storeSubtotal:0};const subtotal=best.price*c.quantity;assignments[best.storeId].items.push({productId:p.id,name:p.name,price:best.price,qty:c.quantity,unit:best.unit,subtotal,isOnSale:best.isOnSale,discountPct:best.discountPct,flippItemId:best.flippItemId});assignments[best.storeId].storeSubtotal+=subtotal});const stores=Object.values(assignments);let totalOptimized=stores.reduce((a,s)=>a+s.storeSubtotal,0)+Math.max(0,stores.length-1)*App.config.tripOverhead;const singleTotals=App.stores.map(s=>{let total=0,ok=true;cartItems.forEach(c=>{const p=App.state.allProducts.find(x=>x.id===c.productId),pr=p?.prices.find(x=>x.storeId===s.id);if(!pr)ok=false;else total+=pr.price*c.quantity});return{storeId:s.id,total:ok?total:Infinity}}).sort((a,b)=>a.total-b.total);const most=singleTotals.filter(x=>isFinite(x.total)).at(-1)?.total||totalOptimized;return{stores,totalOptimized,totalSingleStore:most,savingsAmount:Math.max(0,most-totalOptimized),savingsPct:most?Math.max(0,(most-totalOptimized)/most*100):0,singleTotals,generatedAt:new Date().toISOString   UI:{switchCenterPanel(mode){App.state.centerMode=mode;['grid','flyer','trip'].forEach(m=>document.getElementById(`${m}Panel`).classList.toggle('hidden',m!==mode));document.querySelectorAll('.mobile-tab').forEach(b=>b.classList.toggle('active',(mode==='grid'&&b.dataset.tab==='browse')||(mode==='flyer'&&b.dataset.tab==='flyers')));if(mode!=='trip')document.getElementById('cartPanel').classList.toggle('open',App.state.cartOpen)},toggleCart(force){App.state.cartOpen=force??!App.state.cartOpen;document.getElementById('cartPanel').classList.toggle('open',App.state.cartOpen)},mobileTab(tab){if(tab==='cart'){this.toggleCart(true);document.querySelectorAll('.mobile-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab==='cart'));return}this.toggleCart(false);if(tab==='flyers'){if(App.state.activeStore)this.switchCenterPanel('flyer');else App.Sidebar.activateStore(App.stores[0].id)}else{App.Sidebar.deactivate()}},showToast(msg,type='ok'){const el=document.createElement('div');el.className='toast';el.style.borderLeftColor=type==='warn'?'var(--accent-amber)':'var(--accent-green)';el.textContent=msg;document.getElementById('toastRoot').appendChild(el);setTimeout(()=>el.remove(),2600)},openModal(content){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="App.UI.closeModal()"><div class="modal" onclick="event.stopPropagation()">${content}</div></div>`},closeModal(){document.getElementById('modalRoot').innerHTML=''},compareModal(productId){const p=App.state.allProducts.find(x=>x.id===productId);const prices=App.stores.map(s=>p.prices.find(x=>x.storeId===s.id)||{storeId:s.id,missing:true});const vals=prices.filter(x=>!x.missing).map(x=>App.PriceEngine.normalizeComparable(x));const min=Math.min(...vals),max=Math.max(...vals);const rows=prices.map(x=>{const st=App.store(x.storeId);if(x.missing)return`<div class="price-row-chart"><b>${st.name}</b><span class="muted">— Not available —</span><span></span></div>`;const val=App.PriceEngine.normalizeComparable(x),pct=max?val/max*100:0,ratio=(val-min)/Math.max(.01,max-min),color=`rgb(${Math.round(34+(239-34)*ratio)},${Math.round(197+(68-197)*ratio)},${Math.round(94+(68-94)*ratio)})`;return`<div class="price-row-chart"><b>${st.name}</b><div class="bar-bg"><div class="bar" style="width:${pct}%;background:${color}"></div></div><span>${App.fmtMoney(x.price)} / ${x.unit} ${x.isOnSale?`<small class="sale-dot">SALE -${x.discountPct}%</small>`:''}</span></div>`}).join('');this.openModal(`<div class="modal-head"><div><h2>${p.name}</h2><p class="muted">Price comparison (normalized to per lb)</p></div><button class="modal-close" onclick="App.UI.closeModal()">Close</button></div>${rows}`)},productPlaceholder(product,best){const name=String(product?.name||'Item').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const emoji=product?.emoji||App.emojiFor(product?.category,product?.name)||'🛒';const storeColor=best?.storeId?App.store(best.storeId).color:'#006B3F';const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7FFF3"/><stop offset="1" stop-color="#DFF7CF"/></linearGradient><linearGradient id="fresh" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#006B3F"/><stop offset="1" stop-color="#8DC63F"/></linearGradient></defs><rect width="320" height="220" rx="28" fill="url(#bg)"/><circle cx="260" cy="48" r="42" fill="#FFD400" opacity=".9"/><rect x="26" y="22" width="268" height="176" rx="24" fill="#fff" stroke="#006B3F" stroke-opacity=".28"/><text x="160" y="102" text-anchor="middle" font-size="58">${emoji}</text><text x="160" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#04331F">${name}</text><rect x="78" y="166" width="164" height="26" rx="13" fill="url(#fresh)"/><text x="160" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="white">FreshCo style deal</text><circle cx="36" cy="38" r="9" fill="${storeColor}"/></svg>`;return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`},imageMarkup(product,best,small=false){const src=product.imageUrl||best?.imageUrl||this.productPlaceholder(product,best);return`<img src="${src}" alt="${product.name}" loading="lazy" onerror="handleImageError(this, App.state.allProducts.find(p=>p.id==='${product.id}'))">`},verifyItem(productId){const p=App.state.allProducts.find(x=>x.id===productId),best=p?.prices[0];if(best)App.Sidebar.activateStore(best.storeId,{itemId:best.flippItemId,search:p.name,verifyContext:{name:p.name}})}}
};
function handleImageError(imgEl,product){const key=product?.normalizedName||App.norm(imgEl.alt);if(!imgEl.dataset.offTried){imgEl.dataset.offTried='1';App.DB.get('product_images',key).then(c=>{if(c&&!App.DB.isExpired(c.ts,30)&&c.url){imgEl.src=c.url}else fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(product?.name||imgEl.alt)}&search_simple=1&action=process&json=1&page_size=1&fields=image_url,product_name`).then(r=>r.json()).then(d=>{const url=d.products?.[0]?.image_url;if(url){App.DB.put('product_images',key,{url});imgEl.src=url}else handleImageError(imgEl,product)}).catch(()=>handleImageError(imgEl,product))});return}const wrap=imgEl.parentElement,emoji=product?.emoji||App.emojiFor(product?.category,product?.name);if(emoji){wrap.innerHTML=`<span class="emoji-fallback">${emoji}</span>`;return}const best=product?.prices?.[0],color=best?App.store(best.storeId).color:'#3B82F6';wrap.innerHTML=`<span class="letter-fallback" style="background:${color}">${(product?.name||'?')[0]}</span>`}
