<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="PriceMatch CA — Browse real store flyers, compare basket prices across 6 stores, and generate price-match proof at checkout."/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin"/>
<title>PriceMatch CA — Live Flyer Comparison</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F6D2;</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
<script src="https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js" defer></script>
<script src="https://unpkg.com/@zxing/library@latest" defer></script>
<style>
:root{--bg:#F1F5F9;--w:#fff;--tx:#0F172A;--t2:#475569;--t3:#94A3B8;--bd:#E2E8F0;--bd2:#CBD5E1;--g:#059669;--gd:#047857;--gl:#ECFDF5;--gm:#D1FAE5;--gs:#6EE7B7;--r:#DC2626;--o:#D97706;--b:#2563EB;--sh:0 1px 3px rgba(0,0,0,.07);--shm:0 4px 18px rgba(0,0,0,.09);--ra:14px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);font-family:'DM Sans',-apple-system,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}65%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.fu{animation:fadeUp .38s ease both}.fi{animation:fadeIn .22s ease}
.si{animation:slideIn .3s cubic-bezier(.22,.61,.36,1)}.pop{animation:pop .25s ease both}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.hdr{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);height:64px;display:flex;align-items:center;padding:0 20px;gap:12px}
.logo-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#059669,#34D399);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.logo-name{font-weight:800;font-size:17px;letter-spacing:-.5px;line-height:1}
.logo-name em{color:var(--g);font-style:normal}
.logo-sub{font-size:9px;color:var(--t3);letter-spacing:1.4px;font-weight:600;margin-top:1px}
.srch-wrap{flex:1;position:relative;max-width:500px}
.srch-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--t3);display:flex}
.srch{width:100%;padding:10px 38px;background:#F8FAFC;border:1.5px solid var(--bd);border-radius:11px;color:var(--tx);font-size:14px;font-family:'DM Sans',sans-serif;transition:all .2s}
.srch:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(37,99,235,.1);outline:none}
.srch::placeholder{color:var(--t3)}
.srch-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:#E2E8F0;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2)}
.hdr-loc{display:flex;align-items:center;gap:5px;cursor:pointer;padding:6px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--bd);font-size:12px;font-weight:600;color:var(--t2);white-space:nowrap;flex-shrink:0;transition:all .15s;min-height:36px}
.hdr-loc:hover,.hdr-loc.set{background:var(--gl);border-color:var(--gs);color:var(--g)}
.btn-ol{background:var(--w);color:var(--t2);border:1.5px solid var(--bd);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;font-family:'DM Sans',sans-serif;transition:all .15s;min-height:40px}
.btn-ol:hover{border-color:var(--g);color:var(--g)}.btn-ol.act{background:var(--gl);border-color:var(--gs);color:var(--g)}
.btn-cart{background:var(--tx);color:white;border:none;border-radius:11px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:'DM Sans',sans-serif;transition:all .2s;min-height:44px;white-space:nowrap}
.btn-cart.on{background:var(--g);box-shadow:0 4px 16px rgba(5,150,105,.38)}
.cbadge{background:white;color:var(--g);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.nav-tabs{background:var(--w);border-bottom:1px solid var(--bd);display:flex;padding:0 20px;position:sticky;top:64px;z-index:90;overflow-x:auto}
.nav-tabs::-webkit-scrollbar{height:0}
.ntab{padding:12px 16px;font-size:13px;font-weight:600;color:var(--t3);border:none;background:transparent;cursor:pointer;border-bottom:2.5px solid transparent;font-family:'DM Sans',sans-serif;transition:all .15s;display:flex;align-items:center;gap:6px;white-space:nowrap;min-height:44px}
.ntab:hover{color:var(--t2)}.ntab.on{color:var(--g);border-bottom-color:var(--g)}
.nbadge{background:var(--r);color:white;border-radius:100px;padding:1px 6px;font-size:10px;font-weight:800}
.mode-bar{background:var(--w);border-bottom:1px solid var(--bd);padding:8px 20px;display:flex;gap:8px;align-items:center;position:sticky;top:108px;z-index:89;flex-wrap:wrap}
.mpill{padding:6px 14px;border-radius:100px;font-size:12px;font-weight:600;border:1.5px solid var(--bd);background:var(--w);color:var(--t2);cursor:pointer;white-space:nowrap;transition:all .15s;font-family:'DM Sans',sans-serif;min-height:36px;display:inline-flex;align-items:center;gap:5px}
.mpill:hover{border-color:var(--b);color:var(--b)}.mpill.on{background:var(--b);border-color:var(--b);color:white}
.fresh{margin-left:auto;font-size:11px;color:var(--t3)}
.banner{background:linear-gradient(90deg,#059669,#10B981);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bpill{padding:2px 12px;border-radius:20px;font-size:11px;font-weight:800;background:rgba(255,255,255,.2);color:white}
.bbtn{margin-left:auto;display:flex;align-items:center;gap:5px;padding:7px 14px;background:white;border:none;border-radius:8px;color:var(--g);font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
main{max-width:1300px;margin:0 auto;padding:24px 20px 100px}
.hero{text-align:center;padding:24px 0 32px}
.hero h1{font-size:40px;font-weight:800;letter-spacing:-2px;line-height:1.1;margin-bottom:12px}
.hero h1 em{color:var(--g);font-style:normal}
.hero p{font-size:15px;color:var(--t2);max-width:440px;margin:0 auto 20px;line-height:1.6}
.trust-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tchip{display:flex;align-items:center;gap:5px;padding:6px 12px;background:white;border:1px solid var(--bd);border-radius:20px;font-size:11px;font-weight:600;color:var(--t2);box-shadow:var(--sh)}
.store-pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.spill{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;border:1.5px solid}
.cat-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px}
.cat-tabs::-webkit-scrollbar{height:0}
.cpill{padding:9px 16px;border-radius:100px;font-size:13px;font-weight:600;border:1.5px solid var(--bd);background:var(--w);color:var(--t2);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s;font-family:'DM Sans',sans-serif;min-height:40px}
.cpill:hover{border-color:var(--g);color:var(--g)}.cpill.on{background:var(--g);border-color:var(--g);color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:16px}
.pm-card{background:var(--w);border:1px solid var(--bd);border-radius:var(--ra);overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s,border-color .2s}
.pm-card:hover{transform:translateY(-3px);box-shadow:var(--shm);border-color:var(--bd2)}
.pimg{height:158px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex-shrink:0}
.pemoji{font-size:68px;line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.1))}
.pbadge{position:absolute;top:10px;left:10px;color:white;font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px}
.pb-s{background:var(--r)}.pb-h{background:var(--o)}.pb-d{background:var(--g)}
.pcn{position:absolute;top:10px;right:44px;background:var(--g);color:white;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.wbtn{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.9);border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:all .15s;min-width:28px}
.wbtn:hover{background:white;transform:scale(1.1)}
.bstrip{position:absolute;bottom:0;left:0;right:0;padding:6px 12px;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;backdrop-filter:blur(4px)}
.cbody{padding:14px 14px 12px;flex:1;display:flex;flex-direction:column}
.cname{font-size:14px;font-weight:700;line-height:1.3;margin-bottom:5px}
.ccat{font-size:11px;color:var(--t2);background:#F8FAFC;padding:2px 8px;border-radius:5px;border:1px solid var(--bd);display:inline-block;margin-bottom:10px}
.schips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.sc{font-size:11px;padding:4px 9px;border-radius:7px;border:1px solid;display:inline-flex;align-items:center;gap:2px}
.cfoot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:auto}
.blbl{font-size:10px;color:var(--t3);margin-bottom:2px}
.bpr{font-size:24px;font-weight:800;color:var(--g);letter-spacing:-.5px;line-height:1}
.prsub{font-size:11px;color:#CBD5E1;margin-top:2px}
.btn-add{background:var(--g);color:white;border:none;border-radius:9px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap;min-height:44px}
.btn-add:hover{background:var(--gd);transform:translateY(-1px)}
.qty-ctrl{display:flex;align-items:center;gap:7px;padding:6px 7px 6px 10px;background:#F8FAFC;border-radius:10px;border:1.5px solid var(--bd)}
.qbtn{width:32px;height:32px;border-radius:8px;border:none;cursor:pointer;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:'DM Sans',sans-serif;min-width:32px}
.qbm{background:white;color:var(--t2);box-shadow:0 1px 3px rgba(0,0,0,.1)}.qbp{background:var(--g);color:white}
.qn{min-width:22px;text-align:center;font-size:16px;font-weight:800;color:var(--g)}
/* ── FLYER BROWSER ── */
.flyer-top-bar{background:var(--w);border-bottom:1px solid var(--bd);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.flyer-srch{flex:1;min-width:200px;padding:10px 16px 10px 40px;background:#F8FAFC;border:1.5px solid var(--bd);border-radius:10px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--tx);transition:all .2s;position:relative}
.flyer-srch:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(37,99,235,.1);outline:none}
.flyer-srch::placeholder{color:var(--t3)}
.flyer-srch-wrap{flex:1;position:relative;min-width:200px}
.flyer-srch-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--t3);display:flex}
.idb-status{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:7px;font-size:11px;font-weight:600}
.idb-ok{background:var(--gl);color:var(--gd);border:1px solid var(--gs)}
.idb-loading{background:#EFF6FF;color:var(--b);border:1px solid #BFDBFE}
.idb-error{background:#FEF2F2;color:var(--r);border:1px solid #FECACA}
.spin{animation:spin .8s linear infinite;display:inline-block}
.btn-refresh{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--b);color:white;border:none;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap;min-height:36px}
.btn-refresh:hover{background:#1D4ED8}
.btn-refresh:disabled{opacity:.6;cursor:not-allowed}
.fstore-bar{display:flex;gap:8px;overflow-x:auto;padding:12px 20px 4px;background:var(--w)}
.fstore-bar::-webkit-scrollbar{height:0}
.fst{padding:9px 16px;border-radius:100px;font-size:13px;font-weight:700;border:2px solid;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:6px;min-height:44px}
/* ── FLYER MAGAZINE GRID ── */
.flyer-mag{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px;padding:20px}
.flyer-item{background:var(--w);border-radius:12px;border:1px solid var(--bd);overflow:hidden;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s;cursor:pointer}
.flyer-item:hover{transform:translateY(-3px);box-shadow:var(--shm)}
.fi-img{height:120px;display:flex;align-items:center;justify-content:center;position:relative;font-size:52px}
.fi-pct{position:absolute;top:7px;right:7px;background:var(--r);color:white;font-size:11px;font-weight:800;padding:3px 7px;border-radius:5px}
.fi-va{position:absolute;bottom:6px;right:6px;font-size:9px;color:rgba(255,255,255,.85);background:rgba(0,0,0,.3);padding:2px 5px;border-radius:4px}
.fi-body{padding:10px 12px}
.fi-name{font-size:12px;font-weight:700;line-height:1.3;margin-bottom:4px}
.fi-reg{font-size:11px;color:var(--t3);text-decoration:line-through}
.fi-price{font-size:22px;font-weight:800;color:var(--g);letter-spacing:-.5px;margin:2px 0 8px}
.fi-acts{display:flex;gap:6px}
.bfa{flex:1;padding:7px 0;background:var(--gl);border:1px solid var(--gs);border-radius:7px;color:var(--g);font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;text-align:center;min-height:34px}
.bfa.added,.bfa:hover{background:var(--g);color:white;border-color:var(--g)}
.bfp{flex:1;padding:7px 0;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:7px;color:var(--b);font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;text-align:center;min-height:34px}
.bfp:hover{background:var(--b);color:white;border-color:var(--b)}
/* ── FLYER SEARCH RESULTS ── */
.fsearch-results{padding:20px}
.fsearch-group{margin-bottom:28px}
.fsearch-group-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.fsearch-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.fsearch-cheapest{font-size:10px;background:#DCFCE7;color:var(--g);padding:2px 7px;border-radius:5px;font-weight:800}
/* ── PROOF MODAL ── */
.proof-modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:700;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.proof-card{background:white;border-radius:20px;width:420px;max-width:100%;box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden;animation:fadeUp .3s ease}
.proof-hdr{padding:18px 22px;display:flex;align-items:center;justify-content:space-between}
.proof-store-badge{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;color:white}
.proof-body{padding:0 22px 22px}
.proof-item-row{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--bd)}
.proof-emoji{width:72px;height:72px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0}
.proof-price-block{text-align:center;padding:18px 0;border-bottom:1px solid var(--bd)}
.proof-sale-price{font-size:48px;font-weight:800;color:var(--g);letter-spacing:-2px;line-height:1}
.proof-reg{font-size:14px;color:var(--t3);margin-top:4px}
.proof-save{font-size:14px;font-weight:700;color:var(--g);margin-top:6px}
.proof-details{padding:14px 0;font-size:13px;color:var(--t2);line-height:1.8}
.proof-detail-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.proof-script{background:#F8FAFC;border:1px solid var(--bd);border-radius:10px;padding:14px;margin:14px 0;font-size:13px;color:var(--t2);line-height:1.6;font-style:italic}
.proof-footer{display:flex;gap:10px;padding:14px 0 0}
.btn-print{flex:1;padding:12px;background:var(--b);color:white;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;min-height:44px}
.btn-print:hover{background:#1D4ED8}
.btn-share{flex:1;padding:12px;background:var(--gl);border:1px solid var(--gs);border-radius:10px;font-size:13px;font-weight:700;color:var(--g);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;min-height:44px}
.btn-share:hover{background:var(--g);color:white}
/* ── PRICE MATCH ── */
.msteps{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px;margin-bottom:28px}
.mstep{background:var(--w);border:1px solid var(--bd);border-radius:12px;padding:20px;text-align:center}
.snum{width:36px;height:36px;border-radius:50%;background:var(--b);color:white;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.mres{background:var(--w);border:1.5px solid var(--bd);border-radius:16px;overflow:hidden;margin-bottom:28px}
.mhdr{background:linear-gradient(90deg,#2563EB,#60A5FA);padding:16px 20px;display:flex;align-items:center;gap:12px;color:white}
.mtbl{width:100%;border-collapse:collapse}
.mtbl th{background:#F8FAFC;padding:10px 14px;font-size:11px;font-weight:700;color:var(--t2);text-align:left;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bd)}
.mtbl td{padding:11px 14px;font-size:13px;border-bottom:1px solid #F8FAFC;vertical-align:middle}
.mtbl tr:last-child td{border-bottom:none}.mtbl tr:hover td{background:#FAFAFA}
.m-y{color:var(--g);font-weight:700;font-size:11px;background:var(--gl);padding:2px 8px;border-radius:5px;border:1px solid var(--gs)}
.m-m{color:#D97706;font-weight:700;font-size:11px;background:#FFFBEB;padding:2px 8px;border-radius:5px;border:1px solid #FDE68A}
.m-n{color:var(--t3);font-size:11px}
.m-b td{background:linear-gradient(90deg,var(--gl),#F0FDF4)!important;font-weight:600}
.selc{background:linear-gradient(135deg,#EFF6FF,#DBEAFE);border:1.5px solid #93C5FD;border-radius:14px;padding:16px 18px;margin-bottom:20px;display:flex;gap:14px;align-items:center}
/* ── WATCHLIST ── */
.wlgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(218px,1fr));gap:14px;margin-bottom:28px}
.wlcard{background:var(--w);border:1px solid var(--bd);border-radius:12px;padding:16px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}
.wlcard:hover{transform:translateY(-2px);box-shadow:var(--shm)}
.wdelta{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700}
.dd{background:#DCFCE7;color:var(--g)}.du{background:#FEF2F2;color:var(--r)}.ds2{background:#F8FAFC;color:var(--t3)}
/* ── CART ── */
.float-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:110}

var IDB_DB = null;
var IDB_NAME = 'PriceMatchCA_v1';

function idbOpen() {
  return new Promise(function(resolve) {
    try {
      var req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function(e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains('flyers')) {
          db.createObjectStore('flyers', { keyPath: 'key' });
        }
      };
      req.onsuccess = function(e) { IDB_DB = e.target.result; resolve(true); };
      req.onerror = function() { resolve(false); };
    } catch(e) { resolve(false); }
  });
}

function idbSave(storeName, data) {
  return new Promise(function(resolve) {
    if (!IDB_DB) { resolve(false); return; }
    try {
      var tx = IDB_DB.transaction([storeName], 'readwrite');
      tx.objectStore(storeName).put(data);
      tx.oncomplete = function() { resolve(true); };
      tx.onerror = function() { resolve(false); };
    } catch(e) { resolve(false); }
  });
}

function idbGetAll(storeName) {
  return new Promise(function(resolve) {
    if (!IDB_DB) { resolve([]); return; }
    try {
      var tx = IDB_DB.transaction([storeName], 'readonly');
      var req = tx.objectStore(storeName).getAll();
      req.onsuccess = function() { resolve(req.result || []); };
      req.onerror = function() { resolve([]); };
    } catch(e) { resolve([]); }
  });
}

  return all.length?'<div class="drop-banner">&#x1F514; '+(protects.length?'PRICE PROTECT ALERT ':'PRICE DROP ')+all.map(function(d){return esc(d.item.name)+' $'+d.old.toFixed(2)+' → $'+d.now.toFixed(2)+' at '+d.store+(d.protect?' — possible price adjustment':'');}).join(' • ')+'</div>':'';

    +'<button class="qbtn qbm" data-act="dec" data-id="'+cid+'" aria-label="Decrease">&#x2212;</button>'

function bGrid(filt) {
  if (!filt.length) return '<div style="text-align:center;padding:80px 20px;color:#94A3B8">'
    +'<div style="font-size:60px;margin-bottom:14px">&#x1F50D;</div>'
    +'<h3 style="font-size:19px;font-weight:700;color:#475569;margin-bottom:8px">No results for &ldquo;'+esc(S.search)+'&rdquo;</h3>'
    +'<button class="btn-add" style="margin-top:18px;padding:10px 24px;border-radius:10px;font-size:14px" data-act="clr-search">Clear search</button></div>';
  return '<div class="grid">'+filt.map(function(p,i){
    var bp=bestP(p.id,SIDS),wp=worstP(p.id,SIDS);
    if(!bp)return '';
    var bst=STORES[bp.sid],inC=S.cart[p.id]||0,watched=S.watchlist.includes(p.id);
    var deal=getDeal(p.id,bp.sid);
    var sv=wp&&wp.price>bp.price?(wp.price-bp.price).toFixed(2):null;
    var pct=wp&&wp.price>bp.price?Math.round((wp.price-bp.price)/wp.price*100):null;
    return '<article class="pm-card fu" style="animation-delay:'+(i%12*.04)+'s">'
      +'<div class="pimg" style="background:'+CBG[p.cat]+'">'
      +'<span class="pemoji" aria-hidden="true">'+p.e+'</span>'
      +(deal?'<div class="pbadge pb-d">&#x1F3F7; DEAL</div>':p.sale?'<div class="pbadge pb-s">&#x1F3F7; SALE</div>':p.hot?'<div class="pbadge pb-h">'+SVG.trend+' HOT</div>':'')
      +(inC>0?'<div class="pcn pop">'+inC+'</div>':'')
      +'<button class="wbtn" data-act="toggle-watch" data-id="'+p.id+'" aria-label="'+(watched?'Remove from':'Add to')+' watchlist">'+(watched?'&#x1F514;':'&#x1F515;')+'</button>'
      +(sv?'<div class="bstrip" style="background:'+bst.color+'18;border-top:1px solid '+bst.color+'30">'
        +'<span style="color:'+bst.color+';font-weight:700;font-size:11px">&#x1F3C6; '+bst.name+'</span>'
        +'<span style="color:'+bst.color+';font-size:11px">Save $'+sv+' ('+pct+'%)</span>'
        +'</div>':'')
      +'</div>'
      +'<div class="cbody"><div class="cname">'+esc(p.name)+'</div>'
      +'<span class="ccat">'+p.cat+'</span><div class="unit-price">'+tr('unit')+': '+unitPriceText(p,bp.price)+'</div>'
      +'<div class="schips">'+SIDS.map(function(sid){
        var pr=getPrice(p.id,sid);if(!pr)return '';
        var st=STORES[sid],ib=sid===bp.sid;
        return '<span class="sc" style="background:'+(ib?st.bg:'#F8FAFC')+';color:'+(ib?st.color:'#94A3B8')+';border-color:'+(ib?st.brd:'#E2E8F0')+';font-weight:'+(ib?700:500)+'">'+(ib?'&#x2713; ':'')+st.sh+' $'+pr.price.toFixed(2)+(pr.isDeal?'*':'')+'</span>';
      }).join('')+'</div>'
      +'<div class="cfoot"><div>'
      +'<div class="blbl">'+(bp.isDeal?'&#x1F3F7; Deal at':'Best at')+' '+bst.name+'</div>'
      +'<div class="bpr">$'+bp.price.toFixed(2)+'</div><div class="unit-price">'+unitPriceText(p,bp.price)+'</div>'
      +(wp&&wp.sid!==bp.sid?'<div class="prsub">vs $'+wp.price.toFixed(2)+' at '+STORES[wp.sid].name+'</div>':'')
      +'</div><div style="display:grid;gap:6px">'+bCTA(p.id)+'<button class="mini-btn" data-act="open-bulk" data-id="'+p.id+'">Compare Bulk Size</button>'+(genericAlt(p)?'<button class="mini-btn" data-act="show-generic" data-id="'+p.id+'">Show Generic Alternative</button>':'')+'<button class="mini-btn" data-act="open-protect" data-id="'+p.id+'">Price Protect</button><button class="mini-btn" data-act="open-report" data-id="'+p.id+'">Report a Price</button></div></div></div></article>';
  }).join('')+'</div>';
}

function bFlyers() {

    +'<div class="flyer-srch-wrap">'

  /* ── SEARCH RESULTS MODE ── */

    /* find cheapest price across all results for each item */
    var cheapByName = {};

          cheapByName[fi.name] = fi.price;

    var resultsHtml = '';
    if (results.length === 0) {
      resultsHtml = '<div style="text-align:center;padding:60px 20px;color:#94A3B8">'
        +'<div style="font-size:52px;margin-bottom:14px">&#x1F50D;</div>'

    } else {
      var groupsHtml = results.map(function(r) {
        var sto = STORES[r.storeId];
        var cards = r.items.map(function(fi, i) {
          var isCheapest = fi.price <= cheapByName[fi.name];
          var inC = S.cart[fi.catalogId] || 0;
          return '<article class="flyer-item fu" style="animation-delay:'+(i*0.04)+'s">'

    +'<div><div style="font-size:19px;font-weight:800;color:white;margin-bottom:8px">'+st.name+' &mdash; Official Weekly Flyer</div>'

    +'<span class="ftbadge" style="background:rgba(255,255,255,.2);color:white">&#x1F504; May 25&ndash;31, 2026</span>'

  var magGrid = flyerItems.length === 0

    : '<div class="flyer-mag">'+flyerItems.map(function(fi,i){return bFlyerItemCard(fi,S.flyerStore,i*0.04);}).join('')+'</div>';

    +'<p style="font-size:11px;color:#CBD5E1;padding:12px 20px 80px">Flyers downloaded to this browser via IndexedDB &middot; Search works after the local flyer download finishes &middot; Verify prices in store &middot; Tap &#x1F9FE; Proof for price match certificate</p>';

function bPMRow(sel, sid) {

  var chpB=(isBest&&!isSrc)?'<span style="font-size:10px;background:#DCFCE7;color:#059669;padding:1px 7px;border-radius:4px;font-weight:700">CHEAPER</span>':'';
  var mc='';
  if(elig.state==='match_yes') mc='<div><span class="m-y">&#x2705; YES</span><div style="font-size:10px;color:#94A3B8;margin-top:3px;line-height:1.4">'+esc(elig.reason)+'</div><div style="font-size:9px;color:#CBD5E1">Verified: '+st.pv+'</div></div>';
  else if(elig.state==='match_maybe') mc='<div><span class="m-m">&#x26A0; VERIFY</span><div style="font-size:10px;color:#64748B;margin-top:3px;line-height:1.4">'+esc(elig.reason)+'</div></div>';
  else mc='<span class="m-n">&#x274C; '+esc(elig.reason)+'</span>';
  return '<tr class="'+(isBest?'m-b':'')+'">'
    +'<td><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:'+st.color+';display:inline-block;flex-shrink:0"></span><strong style="color:'+st.color+'">'+st.name+'</strong>'+srcB+chpB+'</div></td>'
    +'<td style="font-weight:'+(isBest?800:400)+';color:'+(isBest?'#059669':st.color)+'">'+(flPr?'$'+flPr.toFixed(2):'<span style="color:#CBD5E1">&mdash;</span>')+'</td>'
    +'<td style="color:#94A3B8;font-size:12px">'+(deal?'$'+deal.reg.toFixed(2):'&mdash;')+'</td>'
    +'<td style="color:var(--g);font-weight:600">'+(deal?'$'+(deal.reg-deal.price).toFixed(2):'&mdash;')+'</td>'
    +'<td>'+mc+'</td></tr>';
}

  var prevY=window.scrollY,fid=document.activeElement&&document.activeElement.id;
  var html=bHdr()+bNav()+bDropBanner()+bInstallBanner();

  else if(S.view==='flyers') html+=bFlyers();
  else if(S.view==='pricematch') html+=bPM();
  else if(S.view==='watchlist') html+=bWL();
  else if(S.view==='preferences') html+=bPreferences();
  else if(S.view==='policies') html+=bPolicies();
  if(S.cartOpen) html+=bCart(items,tots);

/* ═══ EVENTS ════════════════════════════════════════════════════════ */
document.addEventListener('click',async function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,id=el.dataset.id?+el.dataset.id:null,
      tab=el.dataset.tab,view=el.dataset.view,store=el.dataset.store,
      mode=el.dataset.mode,n=el.dataset.n?+el.dataset.n:null,
      cid=el.dataset.cid?+el.dataset.cid:null,sid=el.dataset.sid,
      fid=el.dataset.fid?+el.dataset.fid:null,fsid=el.dataset.fsid,
      pref=el.dataset.pref,budget=el.dataset.budget,diet=el.dataset.diet;

  if(a==='add')           {S.cart[id]=(S.cart[id]||0)+1;var added=CAT.find(function(p){return p.id===id;});if(added)savePriceRecord(added);persist();render();}
  else if(a==='dec')      {if(S.cart[id]>1)S.cart[id]--;else delete S.cart[id];persist();render();}
  else if(a==='rem')      {delete S.cart[id];persist();render();}
  else if(a==='clr-cart') {S.cart={};persist();render();}
  else if(a==='clr-search'){if(S.view==='flyers')S.flyerSearch='';else S.search='';render();}
  else if(a==='clr-fsearch'){S.flyerSearch='';render();}
  else if(a==='set-cat')  {S.cat=el.dataset.cat;render();}
  else if(a==='set-diet') {S.dietFilter=diet;persist();render();}
  else if(a==='toggle-lang'){S.lang=S.lang==='fr'?'en':'fr';persist();render();}
  else if(a==='set-view') {S.view=view;render();}
  else if(a==='set-fstore'){S.flyerStore=store;render();}
  else if(a==='set-mode') {S.basketMode=mode;persist();render();}
  else if(a==='set-max')  {S.maxStores=n;persist();render();}
  else if(a==='open-cart'){S.cartOpen=true;if(tab)S.tab=tab;render();}
  else if(a==='close-cart'){S.cartOpen=false;render();}
  else if(a==='open-auth'){S.authOpen=true;render();}
  else if(a==='close-auth'){S.authOpen=false;render();}
  else if(a==='auth-from-cart'){S.cartOpen=false;S.authOpen=true;render();}
  else if(a==='set-tab')  {S.tab=tab;render();}
  else if(a==='open-postal'){S.fPostal=S.postalCode;S.postalOpen=true;render();}
  else if(a==='close-postal'){S.postalOpen=false;render();}
  else if(a==='save-postal'){var el4=document.getElementById('f-postal');var pc=(el4?el4.value:S.fPostal||'').trim().toUpperCase();if(pc)S.postalCode=pc;S.postalOpen=false;persist();render();}
  else if(a==='toggle-fav'){var idx=S.favouriteStores.indexOf(store);if(idx>-1)S.favouriteStores.splice(idx,1);else S.favouriteStores.push(store);persist();render();}
  else if(a==='toggle-watch'){var idx2=S.watchlist.indexOf(id);if(idx2>-1)S.watchlist.splice(idx2,1);else S.watchlist.push(id);persist();render();}
  else if(a==='toggle-pref'){var ints=prefInterests().slice();var idxp=ints.indexOf(pref);if(idxp>-1)ints.splice(idxp,1);else ints.push(pref);S.preferences.interests=ints;persist();render();}
  else if(a==='set-budget'){S.preferences.budget=budget;persist();render();}
  else if(a==='set-auth-mode'){S.authMode=mode;S.authMsg='';render();}
  else if(a==='toggle-chat'){S.chatOpen=!S.chatOpen;render();}
  else if(a==='send-chat'){var q=(document.getElementById('chat-input')||{}).value||S.chatInput;S.chatInput='';if(q.trim()){S.chatMessages.push({from:'me',text:q.trim()});S.chatMessages.push({from:'bot',text:chatAnswer(q)});S.chatMessages=S.chatMessages.slice(-20);}render();}
  else if(a==='offline-profile'){S.user={name:'Offline Shopper',email:'',provider:'offline'};S.authOpen=false;S.authMsg='';persist();render();}
  else if(a==='show-proof'){
    var item2=CAT.find(function(p){return p.id===fid;});
    if(item2&&fsid){
      var deal2=getDeal(fid,fsid);
      var price2=deal2?deal2.price:(getPrice(fid,fsid)||{price:0}).price;
      var reg2=deal2?deal2.reg:price2;
      var pct2=deal2?deal2.pct:0;
      S.proofItem=Object.assign({},item2,{storeId:fsid,price:price2,reg:reg2,pct:pct2,va:deal2?deal2.va:TODAY,sourceUrl:STORES[fsid].flyerUrl});
      var proofs=loadLocal('pm_proofs',[]);proofs.push({id:fid,storeId:fsid,price:price2,reg:reg2,date:new Date().toISOString().slice(0,10)});saveLocal('pm_proofs',proofs.slice(-200));
      render();
    }
  }
  else if(a==='close-proof'){S.proofItem=null;render();}
  else if(a==='copy-proof'){if(S.proofItem)copyProofImage(S.proofItem).catch(function(){});}
  else if(a==='share-proof'){
    if(S.proofItem){shareProofImage(S.proofItem).catch(function(){var pi=S.proofItem;if(navigator.share)navigator.share({title:'Price Match Proof - '+pi.name,text:pi.name+' is $'+pi.price.toFixed(2)+' at '+STORES[pi.storeId].name+'. Valid May 25-31 2026.',url:STORES[pi.storeId].flyerUrl}).catch(function(){});});}
  }
  else if(a==='sel-match'){
    var item3=CAT.find(function(p){return p.id===cid;});
    if(item3&&sid){var deal3=getDeal(cid,sid);var price3=deal3?deal3.price:(getPrice(cid,sid)||{price:0}).price;var reg3=deal3?deal3.reg:price3;S.matchItem=Object.assign({},item3,{storeId:sid,dealPrice:price3,reg:reg3});S.view='pricematch';render();}
  }
  else if(a==='clr-match'){S.matchItem=null;render();}
  else if(a==='refresh-flyers'){if(!S.idbFetching){S.idbFetching=true;render();saveAllFlyersToIDB().then(function(){S.idbFetching=false;render();});}}
  else if(a==='set-radius'){S.radiusKm=n||10;persist();render();}
  else if(a==='toggle-loyalty'){S.loyaltyOn=!S.loyaltyOn;persist();render();}
  else if(a==='open-bulk'){S.bulkItem=id;render();}
  else if(a==='close-bulk'){S.bulkItem=null;render();}
  else if(a==='show-generic'){S.genericItem=id;render();}
  else if(a==='close-generic'){S.genericItem=null;render();}
  else if(a==='open-protect'){S.protectItem=id;render();}
  else if(a==='close-protect'){S.protectItem=null;render();}
  else if(a==='save-protect'){var watches=loadLocal('pm_price_protect',[]);if(S.protectItem)watches.push({id:S.protectItem,date:new Date().toISOString().slice(0,10)});saveLocal('pm_price_protect',watches.slice(-200));S.protectItem=null;render();}
  else if(a==='open-scanner'){S.scannerOpen=true;render();}
  else if(a==='close-scanner'){if(S.barcodeReader&&S.barcodeReader.reset)S.barcodeReader.reset();S.scannerOpen=false;render();}
  else if(a==='start-scanner'){startBarcodeScanner();}
  else if(a==='open-ai-settings'){S.aiSettingsOpen=true;render();}
  else if(a==='close-ai-settings'){S.aiSettingsOpen=false;render();}
  else if(a==='ask-ai'){var keyEl=document.getElementById('ai-key'),qEl=document.getElementById('ai-q');S.aiKey=(keyEl&&keyEl.value)||S.aiKey;S.aiQuestion=(qEl&&qEl.value)||'';S.aiAnswer=S.aiKey?'AI connection is not enabled in this static demo. Try the built-in chat for local flyer answers.':'Add an API key to enable this beta feature.';render();}
  else if(a==='install-pwa'){var prompt=S.deferredInstallPrompt;if(prompt&&prompt.prompt){prompt.prompt();}localStorage.setItem('pm_install_dismissed','1');S.deferredInstallPrompt=null;render();}
  else if(a==='dismiss-install'){localStorage.setItem('pm_install_dismissed','1');render();}
  else if(a==='open-report'){S.authMsg='Report saved locally for review.';S.authOpen=true;render();}
  else if(a==='save-receipt'){var saved=loadLocal('pm_receipts',[]).concat(S.receiptItems||[]);saveLocal('pm_receipts',saved.slice(-500));S.receiptItems=[];render();}
  else if(a==='share-basket'){var b=encodeBasketParam();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(location.origin+location.pathname+'?basket='+encodeURIComponent(b)).catch(function(){});}
  else if(a==='sign-in'){
    var el5=document.getElementById('f-name'), el6=document.getElementById('f-email'), el8=document.getElementById('f-pass');
    var nm=(el5?el5.value:S.fName||'').trim(), email=(el6?el6.value:S.fEmail||'').trim().toLowerCase(), pass=(el8&&el8.value)||'';
    if(S.authMode!=='signin' && !nm){S.authMsg='Error: name is required for signup.';render();return;}
    if(!validEmail(email)){S.authMsg='Error: enter a valid email address.';render();return;}
    if(pass.length<8){S.authMsg='Error: password must be at least 8 characters.';render();return;}
    try{
      if(!supabaseConfigured()){S.authMsg='Error: configure Supabase URL and anon key before real signup/login. Use Continue offline for a local-only profile.';render();return;}
      var data=await authWithSupabase(S.authMode,email,pass,nm);
        var u=data.user || (data.session&&data.session.user) || {};
        S.user={name:(u.user_metadata&&u.user_metadata.full_name)||nm||email.split('@')[0],email:email,id:u.id||'',provider:'supabase'};
      S.authMsg=S.authMode==='signin'?'Login successful.':'Signup successful. Check your email if Supabase confirmation is enabled.';
      if(el8)el8.value='';S.authOpen=false;persist();render();
    }catch(err){S.authMsg='Error: '+err.message;render();}
  }
});


document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='receipt-file'){
    var file=e.target.files&&e.target.files[0], out=document.getElementById('receipt-output'); if(!file)return;
    if(out)out.innerHTML='Scanning receipt...';
    if(!window.Tesseract){if(out)out.innerHTML='Tesseract.js is still loading. Try again in a moment.';return;}
    Tesseract.recognize(file,'eng').then(function(res){
      var lines=(res.data.text||'').split(/\n/), parsed=[];
      lines.forEach(function(line){var m=line.match(/(.{3,}?)\s+\$?([0-9]+\.[0-9]{2})\s*$/); if(m)parsed.push({productName:m[1].trim().slice(0,60),store:'Receipt',storeId:'receipt',price:+m[2],date:new Date().toISOString().slice(0,10)});});
      S.receiptItems=parsed;
      if(out)out.innerHTML=parsed.length?'<div style="font-weight:800;margin-bottom:6px">Parsed items</div>'+parsed.map(function(x,i){return '<div>'+esc(x.productName)+' — $'+x.price.toFixed(2)+'</div>';}).join('')+'<button class="mini-btn" data-act="save-receipt" style="margin-top:8px">Confirm & save to history</button>':'No prices found. Try a clearer receipt image.';
    }).catch(function(){if(out)out.innerHTML='Receipt scan failed. Try another image.';});
  }
});


async function startBarcodeScanner(){
  var out=document.getElementById('scanner-result');
  if(!window.ZXing){S.scannerResult='ZXing is still loading. Try again in a moment.';render();return;}
  try{
    var reader=new ZXing.BrowserMultiFormatReader(); S.barcodeReader=reader;
    if(out)out.textContent='Camera starting...';
    reader.decodeFromVideoDevice(null,'barcode-video',async function(result,err){
      if(result){
        var code=result.getText();
        if(S.barcodeReader&&S.barcodeReader.reset)S.barcodeReader.reset();
        S.scannerResult='Barcode '+code+' found. Looking up product...'; render();
        try{
          var r=await fetch('https://world.openfoodfacts.org/api/v0/product/'+encodeURIComponent(code)+'.json');
          var data=await r.json();
          var name=(data.product&&(data.product.product_name||data.product.generic_name))||code;
          S.search=name; S.view='shop'; S.scannerOpen=false; render();
        }catch(e){S.scannerResult='Barcode '+code+' found, but Open Food Facts lookup failed.';render();}
      }
    });
  }catch(e){S.scannerResult='Camera unavailable or permission denied.';render();}
}

document.addEventListener('keydown',function(e){
  if(e.key==='Enter' && document.activeElement && document.activeElement.id==='chat-input'){e.preventDefault();var q=document.activeElement.value||S.chatInput;S.chatInput='';if(q.trim()){S.chatMessages.push({from:'me',text:q.trim()});S.chatMessages.push({from:'bot',text:chatAnswer(q)});S.chatMessages=S.chatMessages.slice(-20);}render();return;}
  if(e.key==='Escape'){
    if(S.proofItem){S.proofItem=null;render();}
    else if(S.postalOpen){S.postalOpen=false;render();}
    else if(S.authOpen){S.authOpen=false;render();}
    else if(S.bulkItem){S.bulkItem=null;render();}
    else if(S.genericItem){S.genericItem=null;render();}
    else if(S.scannerOpen){S.scannerOpen=false;render();}
    else if(S.aiSettingsOpen){S.aiSettingsOpen=false;render();}
    else if(S.protectItem){S.protectItem=null;render();}
    else if(S.cartOpen){S.cartOpen=false;render();}
  }
});

  updateVisitStreak();

  if(ok) {

  } else {

    render();

}
init();
