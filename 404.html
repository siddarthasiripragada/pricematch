<head>

<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PriceMatch CA — Opening flyer</title>
<script>
(function(){
  var path = location.pathname.replace(/^\/pricematch/, '') || '/';
  var target = '/pricematch/?route=' + encodeURIComponent(path) + location.search.replace(/^\?/, '&');
  location.replace(target);
}());
</script>
</head>
<body>
<p>Opening PriceMatch CA flyer…</p>
